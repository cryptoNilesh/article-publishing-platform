
<section class="create-page">
  <div class="create-container">

    <div class="page-heading">
      <a routerLink="/" class="back-link">← Back to Home</a>
      <h1>Write Your Article</h1>
      <p>Share your ideas, knowledge and stories with the community.</p>
    </div>

    @if (errorMessage) {
      <div class="message error-message">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="message success-message">
        {{ successMessage }}
      </div>
    }

    <form #articleForm="ngForm" (ngSubmit)="publishArticle()">

      <div class="form-group">
        <label for="title">Article Title *</label>
        <input
          id="title"
          type="text"
          name="title"
          [(ngModel)]="title"
          (ngModelChange)="generateSlug()"
          placeholder="Enter an engaging article title"
          maxlength="200"
          required
        />
      </div>

      <div class="form-group">
        <label for="slug">Article URL Slug *</label>
        <input
          id="slug"
          type="text"
          name="slug"
          [(ngModel)]="slug"
          placeholder="article-url-slug"
          maxlength="250"
          required
        />
        <small>Used in your article URL. Must be unique.</small>
      </div>

      <div class="form-group">
        <label for="summary">Short Summary</label>
        <textarea
          id="summary"
          name="summary"
          [(ngModel)]="summary"
          placeholder="Write a short introduction for your article"
          maxlength="500"
          rows="3"
        ></textarea>
        <small>{{ summary.length }}/500 characters</small>
      </div>

      <div class="form-group">
        <label for="content">Article Content *</label>
        <textarea
          id="content"
          name="content"
          [(ngModel)]="content"
          placeholder="Start writing your article here..."
          rows="14"
          required
        ></textarea>
      </div>

      <div class="form-actions">
        <button
          type="button"
          class="draft-button"
          [disabled]="loading || !articleForm.valid"
          (click)="saveDraft()"
        >
          Save as Draft
        </button>

        <button
          type="submit"
          class="publish-button"
          [disabled]="loading || !articleForm.valid"
        >
          {{ loading ? 'Please wait...' : 'Publish Article' }}
        </button>
      </div>

    </form>
  </div>
</section>
